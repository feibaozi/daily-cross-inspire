<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💬 知识管家 · 跨界灵感</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #0f0f1a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
.header { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 16px 20px; border-bottom: 1px solid #2a2a4a; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 18px; color: #fff; }
.header .subtitle { font-size: 12px; color: #888; }
.clear-btn { background: transparent; border: 1px solid #444; color: #aaa; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.clear-btn:hover { border-color: #f87171; color: #f87171; }
.messages { flex: 1; overflow-y: auto; padding: 20px; }
.msg { max-width: 80%; margin-bottom: 16px; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.msg.user { margin-left: auto; }
.msg.assistant { margin-right: auto; }
.msg-bubble { padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.7; word-break: break-word; }
.msg.user .msg-bubble { background: #2a4a7f; border-bottom-right-radius: 4px; }
.msg.assistant .msg-bubble { background: #1e1e3a; border: 1px solid #2a2a4a; border-bottom-left-radius: 4px; }
.msg .role { font-size: 11px; color: #666; margin-bottom: 4px; }
.msg.user .role { text-align: right; }
.typing { display: inline-block; }
.typing span { display: inline-block; width: 6px; height: 6px; background: #4a9eff; border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }
.input-area { padding: 16px 20px; background: #1a1a2e; border-top: 1px solid #2a2a4a; }
.input-wrap { display: flex; gap: 10px; max-width: 800px; margin: 0 auto; }
.input-wrap input { flex: 1; padding: 12px 16px; border: 1px solid #333; border-radius: 12px; background: #0f0f1a; color: #fff; font-size: 14px; outline: none; }
.input-wrap input:focus { border-color: #4a9eff; }
.input-wrap button { padding: 12px 24px; background: #4a9eff; color: #fff; border: none; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: bold; }
.input-wrap button:hover { background: #3a8eef; }
.input-wrap button:disabled { background: #333; cursor: not-allowed; }
.suggestions { display: flex; gap: 8px; padding: 0 20px 12px; max-width: 800px; margin: 0 auto; flex-wrap: wrap; }
.sug-btn { background: #1e1e3a; border: 1px solid #2a2a4a; color: #aaa; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; }
.sug-btn:hover { border-color: #4a9eff; color: #4a9eff; }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>💬 知识管家</h1>
    <div class="subtitle">关于你读过的文章，问我任何问题</div>
  </div>
  <button class="clear-btn" onclick="clearHistory()">🗑️ 清除对话</button>
</div>
<div class="messages" id="messages"></div>
<div class="suggestions" id="suggestions">
  <button class="sug-btn" onclick="sendSuggestion(this)">昨天那篇文章能再解释一下吗？</button>
  <button class="sug-btn" onclick="sendSuggestion(this)">量子物理和认知科学有什么联系？</button>
  <button class="sug-btn" onclick="sendSuggestion(this)">推荐一个我可能感兴趣的领域</button>
</div>
<div class="input-area">
  <div class="input-wrap">
    <input type="text" id="input" placeholder="问我任何关于知识的问题..." onkeydown="if(event.key==='Enter')send()">
    <button id="sendBtn" onclick="send()">发送</button>
  </div>
</div>
<script>
const API_URL = window.location.origin + '/chat';
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const label = role === 'user' ? '你' : '🤖 管家';
  div.innerHTML = `<div class="role">${label}</div><div class="msg-bubble">${content}</div>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'typing';
  div.innerHTML = `<div class="role">🤖 管家</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

async function send() {
  const msg = inputEl.value.trim();
  if (!msg) return;
  inputEl.value = '';
  addMessage('user', msg);
  sendBtn.disabled = true;
  addTyping();
  try {
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg })
    });
    const data = await resp.json();
    removeTyping();
    addMessage('assistant', data.reply || '（无回复）');
  } catch(e) {
    removeTyping();
    addMessage('assistant', '⚠️ 连接失败，请确认 API 服务正在运行');
  }
  sendBtn.disabled = false;
  inputEl.focus();
}

function sendSuggestion(btn) {
  inputEl.value = btn.textContent;
  send();
}

async function clearHistory() {
  try {
    await fetch(API_URL + '/clear', { method: 'POST' });
    messagesEl.innerHTML = '';
    addMessage('assistant', '对话已清除 🧹 有什么新问题？');
  } catch(e) {}
}
</script>
</body>
</html>
